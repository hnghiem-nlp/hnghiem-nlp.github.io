{%- assign featured = site.publications
| where_exp: "p", "p.selected == true"
| sort: "order" -%}

<div class="pub-list">
    {%- for pub in featured limit:6 -%}
    {%- include pub_entry.html pub=pub -%}
    {%- endfor -%}
</div>

<p class="more-link"><a href="{{ '/publications/' | relative_url }}">All publications &rarr;</a></p>
